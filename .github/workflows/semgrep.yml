name: M4 Semgrep SAST

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan sample application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep training rules
        run: |
          mkdir -p sast
          semgrep scan --config .semgrep/rules.yml --json --output sast/semgrep-results.json app/

      - name: Upload SAST JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-results
          path: sast/semgrep-results.json
          if-no-files-found: warn
          retention-days: 14
