
name: M4 Logger Tests

on:
  push:
    branches:
      - feature/m4-dashboard-logging
    paths:
      - "src/event_logger.py"
      - "tests/test_event_logger.py"
      - ".github/workflows/m4-logger-tests.yml"

  pull_request:
    paths:
      - "src/event_logger.py"
      - "tests/test_event_logger.py"
      - ".github/workflows/m4-logger-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  logger-tests:
    name: Test common event logger
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run logger tests
        run: python -m pytest -q tests/test_event_logger.py
