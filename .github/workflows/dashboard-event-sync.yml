name: Dashboard Event Sync

on:
  workflow_run:
    workflows:
      - build-sbom
      - triage
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  sync-events:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Download and merge workflow JSONL artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import urllib.request
          import urllib.error
          import zipfile
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          workflow_name = os.environ["WORKFLOW_NAME"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          artifacts = get_json(f"{api}/actions/runs/{run_id}/artifacts?per_page=100")
          if workflow_name == "build-sbom":
              candidates = [a for a in artifacts.get("artifacts", [])
                            if a["name"].startswith("security-events-")]
              wanted = "security-events.jsonl"
          elif workflow_name == "triage":
              candidates = [a for a in artifacts.get("artifacts", [])
                            if a["name"].startswith("triage-events-")]
              wanted = "ai-triage-events.jsonl"
          else:
              raise SystemExit(f"Unexpected workflow: {workflow_name}")

          if not candidates:
              raise SystemExit("No matching JSONL artifact found for this run.")
          artifact = max(candidates, key=lambda item: item["created_at"])
          download_url = f"{api}/actions/artifacts/{artifact['id']}/zip"

          # GitHub redirects artifact downloads to temporary object-storage URLs.
          # Do not forward the GitHub Authorization header to that external host.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, new_url):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          request = urllib.request.Request(download_url, headers=headers)
          try:
              with opener.open(request, timeout=30) as response:
                  archive_bytes = response.read()
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308):
                  raise
              location = error.headers.get("Location")
              if not location:
                  raise SystemExit("GitHub artifact download did not provide a redirect URL.")
              # The redirect URL is short-lived and already authorized by GitHub.
              with urllib.request.urlopen(location, timeout=60) as response:
                  archive_bytes = response.read()

          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              matches = [name for name in archive.namelist()
                         if name.endswith(wanted)]
              if not matches:
                  raise SystemExit(f"{wanted} missing from artifact {artifact['name']}")
              incoming = archive.read(matches[0]).decode("utf-8")

          target = Path("dashboard/public/data/events.jsonl")
          target.parent.mkdir(parents=True, exist_ok=True)
          existing = []
          if target.exists():
              for line in target.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      event = json.loads(line)
                      # Remove the old hand-created demo snapshot once live data arrives.
                      if str(event.get("pipeline_run_id")) != "43214957909":
                          existing.append(event)

          incoming_events = [json.loads(line) for line in incoming.splitlines() if line.strip()]
          merged = {}
          for event in existing + incoming_events:
              key = (
                  str(event.get("pipeline_run_id", "")),
                  str(event.get("tool", "")),
                  str(event.get("stage", "")),
                  str(event.get("finding_id", "")),
                  str(event.get("severity", "")),
                  str(event.get("message", "")),
              )
              merged[key] = event

          ordered = sorted(merged.values(), key=lambda event: (
              str(event.get("timestamp", "")),
              str(event.get("pipeline_run_id", "")),
              str(event.get("tool", "")),
              str(event.get("finding_id", "")),
          ))
          target.write_text(
              "".join(json.dumps(event, ensure_ascii=False, separators=(",", ":")) + "\n"
                      for event in ordered),
              encoding="utf-8",
          )
          print(f"Merged {len(incoming_events)} events; dashboard now has {len(ordered)} events.")
          PY

      - name: Commit updated dashboard events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/data/events.jsonl
          if git diff --cached --quiet; then
            echo "No dashboard event changes to commit."
            exit 0
          fi
          git commit -m "chore(dashboard): sync latest pipeline events [skip ci]"
          git push origin HEAD:main
