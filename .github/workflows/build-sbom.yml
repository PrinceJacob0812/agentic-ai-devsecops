name: build-sbom

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-sbom-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/app"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Build and push image (once)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate SBOM from the pushed image digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-${{ github.sha }}.cdx.json
      - name: Validate SBOM
        id: validate
        run: |
          test -s sbom.cdx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' sbom.cdx.json
      - name: Scan SBOM for known vulnerabilities (Grype)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: false
      - name: Summarize vulnerability findings
        env:
          SARIF: ${{ steps.grype.outputs.sarif }}
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Vulnerability findings: $(jq '[.runs[].results[]] | length' "$SARIF")"
      - name: Upload vulnerability report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report-${{ github.sha }}
          path: ${{ steps.grype.outputs.sarif }}
      - name: Scan SBOM again for the JSON report (severity labels)
        id: grype_json
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: false
          output-format: json
      - name: Check JSON report and count severity labels
        env:
          GRYPE_JSON: ${{ steps.grype_json.outputs.json }}
        run: |
          test -s "$GRYPE_JSON"
          jq -e '.matches | type == "array"' "$GRYPE_JSON"
          jq -r '[.matches[].vulnerability.severity] | group_by(.) | map("\(.[0]): \(length)") | .[]' "$GRYPE_JSON"
      - name: Upload Grype JSON report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-json-${{ github.sha }}
          path: ${{ steps.grype_json.outputs.json }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image by digest (keyless)
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"
      - name: Attach SBOM as signed attestation (keyless)
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_REF"
      - name: Verify signature and attestation
        id: verify
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-sbom.yml@${{ github.ref }}
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE_REF"
          cosign verify-attestation --type cyclonedx --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE_REF" > signed-sbom-attestation.json
          test -s signed-sbom-attestation.json
      - name: Upload signing proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-sbom-${{ github.sha }}
          path: |
            sbom.cdx.json
            signed-sbom-attestation.json
      - name: Install OPA (pinned)
        uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5 # v2.2.0
        with:
          version: 1.8.0
      - name: Run policy tests
        run: opa test policies/ -v
      - name: Deployment gate (OPA)
        id: gate
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-sbom.yml@${{ github.ref }}
          GRYPE_JSON: ${{ steps.grype_json.outputs.json }}
        run: bash scripts/gate.sh
      - name: Write security events (JSON Lines)
        if: ${{ !cancelled() }}
        env:
          RUN_ID: ${{ github.run_id }}
          VALIDATE: ${{ steps.validate.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          GATE: ${{ steps.gate.outcome }}
          GRYPE_JSON: ${{ steps.grype_json.outputs.json }}
        run: |
          set -euo pipefail
          OUT=security-events.jsonl
          : > "$OUT"
          TS="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          emit() {
            jq -nc --arg ts "$TS" --arg run "$RUN_ID" --arg stage "$1" --arg tool "$2" \
              --arg type "$3" --arg sev "$4" --arg msg "$5" --arg status "$6" --arg count "$7" \
              '{timestamp:$ts, project:"agentic-ai-devsecops", pipeline_run_id:$run, stage:$stage, tool:$tool, event_type:$type, severity:(if $sev == "" then null else $sev end), rule_id:null, file:null, message:$msg, status:$status} + (if $count == "" then {} else {count:($count|tonumber)} end)' >> "$OUT"
          }
          status_of() { case "$1" in success) echo PASSED ;; failure) echo FAILED ;; *) echo "" ;; esac; }
          ST="$(status_of "$VALIDATE")"
          if [ -n "$ST" ] && [ -s sbom.cdx.json ]; then
            N="$(jq '[.components[]? | select(.type != "file")] | length' sbom.cdx.json)"
            emit sbom syft scan_summary "" "SBOM validated: $N packages" "$ST" "$N"
          fi
          if [ -n "${GRYPE_JSON:-}" ] && [ -s "$GRYPE_JSON" ]; then
            jq -r '[.matches[]?.vulnerability.severity] | group_by(.) | map("\(.[0])\t\(length)") | .[]' "$GRYPE_JSON" | while IFS=$'\t' read -r SEV N; do
              SEVU="$(echo "$SEV" | tr '[:lower:]' '[:upper:]')"
              emit dependency-scan grype scan_summary "$SEVU" "$SEV: $N findings" OPEN "$N"
            done
          fi
          ST="$(status_of "$VERIFY")"
          if [ -n "$ST" ]; then
            emit signature cosign verification "" "Image signature and SBOM attestation verification" "$ST" ""
          fi
          ST="$(status_of "$GATE")"
          if [ "$ST" = "PASSED" ]; then
            emit gate opa verification "" "ALLOWED: signature, SBOM attestation and vulnerability checks passed" "$ST" ""
          elif [ "$ST" = "FAILED" ]; then
            emit gate opa verification "" "DENIED: the deployment gate rejected the image" "$ST" ""
          fi
          if [ -s "$OUT" ]; then jq -c . "$OUT" > /dev/null; cat "$OUT"; fi
      - name: Upload security events
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-events-${{ github.sha }}
          path: security-events.jsonl
          if-no-files-found: warn