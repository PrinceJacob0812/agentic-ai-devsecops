name: triage

on:
  push:
    paths:
      - ".github/workflows/triage.yml"
      - "app/**"
      - ".semgrep/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triage-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENT_REF: main

jobs:
  agent-tests:
    name: Agent tests (fake key)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AGENT_REF }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install agent dependencies
        run: python -m pip install groq python-dotenv pytest
      - name: Run agent tests
        env:
          GROQ_API_KEY: test-key-not-real
          PYTHONPATH: src
        run: python -m pytest -q tests

  triage:
    name: Semgrep scan and AI triage
    needs: agent-tests
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out this branch (app and Semgrep rules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AGENT_REF }}
          path: agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep and agent dependencies
        run: python -m pip install semgrep groq python-dotenv
      - name: Run Semgrep
        run: |
          mkdir -p sast
          semgrep scan --config .semgrep/rules.yml --json --output sast/semgrep-results.json app/
      - name: Fill in code snippets hidden by Semgrep
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("sast/semgrep-results.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          for r in data.get("results", []):
              src = Path(r["path"])
              if src.is_file():
                  lines = src.read_text(encoding="utf-8").splitlines()
                  s, e = r["start"]["line"], r["end"]["line"]
                  r.setdefault("extra", {})["lines"] = "\n".join(lines[s-1:e])
          p.write_text(json.dumps(data, indent=2), encoding="utf-8")
          PY
      - name: Run AI triage
        working-directory: agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python -m src.agent --format semgrep --input ../sast/semgrep-results.json --output ../results/triage_results.json
      - name: Check triage results
        run: |
          test -s results/triage_results.json
          jq -e 'type == "array" and (length == 0 or any(.[]; has("error") | not))' results/triage_results.json
          echo "Findings triaged: $(jq 'length' results/triage_results.json)"
          jq -r 'group_by(.classification)[] | "\(.[0].classification): \(length)"' results/triage_results.json
      - name: Upload triage results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-results-${{ github.sha }}
          path: |
            sast/semgrep-results.json
            results/triage_results.json
          if-no-files-found: warn
          retention-days: 14