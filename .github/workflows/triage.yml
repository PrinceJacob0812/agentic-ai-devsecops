name: triage

on:
  push:
    paths:
      - ".github/workflows/triage.yml"
      - "app/**"
      - ".semgrep/**"
      - "src/**"
      - "tests/**"
      - "docs/logging-schema.md"
      - "docs/m2-week4-ai-triage-handoff.md"
      - "docs/m2-ai-triage-evaluation.md"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/triage.yml"
      - "app/**"
      - ".semgrep/**"
      - "src/**"
      - "tests/**"
      - "docs/logging-schema.md"
      - "docs/m2-week4-ai-triage-handoff.md"
      - "docs/m2-ai-triage-evaluation.md"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-tests:
    name: M2 agent and exporter tests
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt semgrep

      - name: Run tests
        env:
          GROQ_API_KEY: test-key-not-real
          PYTHONPATH: .
        run: python -m pytest -q tests

  triage:
    name: Semgrep scan, AI triage and event export
    needs: agent-tests
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt semgrep

      - name: Prepare output directories
        run: mkdir -p sast results logs

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config .semgrep/rules.yml \
            --json \
            --output sast/semgrep-results.json \
            app/

      - name: Fill in code snippets hidden by Semgrep
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("sast/semgrep-results.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          for finding in data.get("results", []):
              source = Path(finding["path"])
              if source.is_file():
                  lines = source.read_text(encoding="utf-8").splitlines()
                  start = finding["start"]["line"]
                  end = finding["end"]["line"]
                  finding.setdefault("extra", {})["lines"] = "\n".join(
                      lines[start - 1:end]
                  )

          path.write_text(json.dumps(data, indent=2), encoding="utf-8")
          PY

      - name: Run AI triage
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: |
          python -m src.agent \
            --format semgrep \
            --input sast/semgrep-results.json \
            --output results/triage_results.json

      - name: Check triage results
        run: |
          test -s results/triage_results.json
          jq -e 'type == "array" and (length == 0 or all(.[]; (has("error") | not)))' results/triage_results.json
          echo "Findings triaged: $(jq 'length' results/triage_results.json)"
          jq -r 'group_by(.classification)[] | "\(.[0].classification): \(length)"' results/triage_results.json

      - name: Export AI triage events
        run: |
          python -m src.triage_events \
            --findings sast/semgrep-results.json \
            --format semgrep \
            --results results/triage_results.json \
            --output logs/ai-triage-events.jsonl \
            --pipeline-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload triage and event artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: triage-events-${{ github.sha }}
          path: |
            sast/semgrep-results.json
            results/triage_results.json
            logs/ai-triage-events.jsonl
          if-no-files-found: warn
          retention-days: 14
